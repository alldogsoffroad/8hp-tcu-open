<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Bosch TCU 1034420267 hardware overview</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { stroke: #444; stroke-width: 1.2; }
    .h { font-weight: bold; font-size: 13px; }
    .t { font-size: 15px; font-weight: bold; }
    .s { font-size: 11px; fill: #333; }
    .m { font-family: "Courier New", monospace; font-size: 11px; }
    .note { font-size: 11px; fill: #7a1f1f; }
    .ln { stroke: #555; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .ln2 { stroke: #555; stroke-width: 1.4; fill: none; marker-start: url(#arr); marker-end: url(#arr); }
  </style>

  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="20" y="32" class="t" font-size="18">Bosch TCU 1034420267 (ZF 8HP, Chrysler/Ram): hardware overview</text>
  <text x="20" y="52" class="s">Sources: docs/spec 01, 02, 03, 04, 12, 16, 17, 18. [I] = inference, not yet confirmed on hardware.</text>

  <!-- ===== 16-pin case connector ===== -->
  <rect x="20" y="70" width="230" height="560" rx="8" class="box" fill="#efe9f7"/>
  <text x="35" y="92" class="h">16-pin case connector</text>
  <text x="35" y="108" class="s">(via mechatronic A-row terminals)</text>
  <g class="m">
    <text x="35" y="136">3 / 4   shifter CAN (bus 2)</text>
    <text x="35" y="156">5 / 6   CAN-C (bus 1)</text>
    <text x="35" y="176">9       ignition run/start</text>
    <text x="35" y="196">13      battery B+</text>
    <text x="35" y="216">14      ground</text>
    <text x="35" y="236">15      TRS Park output</text>
  </g>
  <line x1="35" y1="252" x2="235" y2="252" stroke="#999"/>
  <text x="35" y="272" class="s">Not used by the Chrysler harness</text>
  <text x="35" y="287" class="s">(bench 2026-10-18, spec 01 §2.9):</text>
  <g class="m">
    <text x="35" y="310">1 2 7 11 12 16</text>
    <text x="35" y="325">  open unpowered,</text>
    <text x="35" y="340">  ~0 V powered [I] outputs</text>
    <text x="35" y="365">8   21.7 kΩ + cap to GND</text>
    <text x="35" y="380">10   2.6 kΩ + cap to GND</text>
    <text x="35" y="395">  [I] filtered inputs</text>
  </g>
  <line x1="35" y1="412" x2="235" y2="412" stroke="#999"/>
  <text x="35" y="432" class="s">No internal CAN termination</text>
  <text x="35" y="447" class="s">(120 Ω needed at each bench end).</text>
  <text x="35" y="470" class="note">No case pin controls FWE</text>
  <text x="35" y="485" class="note">(spec 01, spec 16).</text>

  <!-- ===== Ceramic hybrid ===== -->
  <rect x="280" y="70" width="640" height="700" rx="10" class="box" fill="#f4f4f4" stroke-dasharray="6 3"/>
  <text x="295" y="92" class="h">Ceramic hybrid controller: bare wire-bonded dies under silicone gel</text>

  <!-- CAN transceivers -->
  <rect x="300" y="110" width="150" height="80" rx="6" class="box" fill="#dbe9f7"/>
  <text x="312" y="130" class="h">CAN transceivers</text>
  <text x="312" y="148" class="s">bus 1: pins 5/6</text>
  <text x="312" y="163" class="s">bus 2: pins 3/4</text>
  <text x="312" y="178" class="s">500 kbit/s</text>

  <!-- Supply / wake -->
  <rect x="300" y="215" width="150" height="80" rx="6" class="box" fill="#e6f2e0"/>
  <text x="312" y="235" class="h">Supply / wake</text>
  <text x="312" y="253" class="s">B+ (13) → AN21 [I]</text>
  <text x="312" y="268" class="s">ignition (9) → AN19/20 [I]</text>
  <text x="312" y="283" class="s">cal. ×1.0553 − 89 mV</text>

  <!-- Supervisor -->
  <rect x="300" y="560" width="150" height="110" rx="6" class="box" fill="#fbe3d6"/>
  <text x="312" y="580" class="h">Supervisor (SSLB1)</text>
  <text x="312" y="598" class="s">reg 0x8E: bit 2 toggles</text>
  <text x="312" y="613" class="s">every ~5 ms (watchdog)</text>
  <text x="312" y="628" class="s">bit 0 = output enable</text>
  <text x="312" y="643" class="s">RSPI-B, spec 03 §4.4</text>
  <text x="312" y="658" class="s">[I] may drive FWE</text>

  <!-- MCU -->
  <rect x="470" y="100" width="260" height="570" rx="8" class="box" fill="#d6e4f5"/>
  <text x="485" y="122" class="h">MCU: Renesas SH7254R</text>
  <text x="485" y="138" class="s">SH-2A, big-endian, FPU</text>
  <text x="485" y="153" class="s">Iφ 120 MHz, Pφ 20 MHz (bench)</text>

  <text x="485" y="178" class="h">Memory</text>
  <rect x="485" y="186" width="230" height="168" fill="#ffffff" stroke="#888"/>
  <g class="m">
    <text x="492" y="202">Code flash 2.5 MB (FWE-locked)</text>
    <text x="492" y="217"> 000000 Bosch boot blocks</text>
    <text x="492" y="232"> 040000 project loader</text>
    <text x="492" y="247"> 180000 stock calibration</text>
    <text x="492" y="262"> 200000 unused</text>
    <text x="492" y="280">User boot MAT 32 KB (Bosch)</text>
    <text x="492" y="298">Data flash 128 KB</text>
    <text x="492" y="313"> DB00-07 project RAM app</text>
    <text x="492" y="328"> DB08-15 stock EEPROM ring</text>
    <text x="492" y="346">RAM 128 KB (app at FFF84100)</text>
  </g>

  <text x="485" y="378" class="h">Peripherals in use</text>
  <g class="s">
    <text x="485" y="396">RCAN-A/B (bus 1), RCAN-C (bus 2)</text>
    <text x="485" y="412">RSPI-A: 5 driver chips</text>
    <text x="485" y="428">  (SSLA3, 2, 1, 0, 5)</text>
    <text x="485" y="444">RSPI-B: supervisor and others</text>
    <text x="485" y="460">ATU-III timer F: TIF12/13/14</text>
    <text x="485" y="476">  (PF6-PF8) speed capture</text>
    <text x="485" y="492">ATU-III TOE31 (PL6): park hold</text>
    <text x="485" y="508">ADC: AN8/AN1 fluid temp,</text>
    <text x="485" y="524">  AN5/AN6 park contacts [I]</text>
  </g>

  <rect x="485" y="540" width="230" height="124" fill="#fff4f4" stroke="#c88"/>
  <text x="492" y="558" class="h" fill="#7a1f1f">Flash write paths</text>
  <g class="s">
    <text x="492" y="575">FWE (ball A11) high at reset, low</text>
    <text x="492" y="590">before hand-over (spec 16 §10).</text>
    <text x="492" y="608">Code flash: ACDP-2 via the boot</text>
    <text x="492" y="623">MAT plant session (spec 17).</text>
    <text x="492" y="641">Data flash: project loader +</text>
    <text x="492" y="656">Teensy 4.1 (spec 18).</text>
  </g>

  <!-- Driver chips -->
  <rect x="750" y="100" width="150" height="250" rx="6" class="box" fill="#fde8c8"/>
  <text x="762" y="120" class="h">Solenoid drivers</text>
  <text x="762" y="135" class="s">5 dies, low-side, SPI</text>
  <g class="m">
    <text x="762" y="160">chip0  ch0 A</text>
    <text x="762" y="175">       ch1 D</text>
    <text x="762" y="195">chip1  ch2 B</text>
    <text x="762" y="210">       ch3 E</text>
    <text x="762" y="230">chip2  ch4 C</text>
    <text x="762" y="245">       ch5 TCC (WK)</text>
    <text x="762" y="265">chip3  ch6 line (Sys)</text>
    <text x="762" y="280">       ch7 park release</text>
    <text x="762" y="300">chip4  ch8/9 unused</text>
  </g>
  <text x="762" y="325" class="s">setpoints 0xE8 / 0xF0</text>
  <text x="762" y="340" class="s">per chip (spec 12 §1)</text>

  <!-- Park hold driver -->
  <rect x="750" y="370" width="150" height="70" rx="6" class="box" fill="#fde8c8"/>
  <text x="762" y="390" class="h">Park hold driver</text>
  <text x="762" y="407" class="s">ch 11 → TOE31 (PL6)</text>
  <text x="762" y="422" class="s">on/off, ~25 Ω coil</text>

  <!-- Input conditioning -->
  <rect x="750" y="460" width="150" height="130" rx="6" class="box" fill="#e6f2e0"/>
  <text x="762" y="480" class="h">Sensor inputs</text>
  <text x="762" y="498" class="s">ISS / OSS: Hall,</text>
  <text x="762" y="513" class="s">  → TIF12/13 [I]</text>
  <text x="762" y="531" class="s">fluid temp NTC</text>
  <text x="762" y="546" class="s">  → AN8 / AN1</text>
  <text x="762" y="564" class="s">park position sender</text>
  <text x="762" y="579" class="s">  → AN5 / AN6 [I]</text>

  <text x="300" y="705" class="s">Driver chips have no package markings, so datasheets are not available.</text>
  <text x="300" y="721" class="s">Units: solenoid setpoint 0.1 mA [I]; driver replies carry no measured current.</text>
  <text x="300" y="745" class="note">Do not disturb the gel or bond wires.</text>

  <!-- ===== Mechatronic internal terminals ===== -->
  <rect x="950" y="70" width="270" height="560" rx="8" class="box" fill="#fff8e1"/>
  <text x="965" y="92" class="h">Mechatronic internal terminals</text>

  <rect x="965" y="105" width="240" height="250" rx="6" class="box" fill="#ffffff"/>
  <text x="977" y="124" class="h">B row: solenoid lead frame</text>
  <g class="s">
    <text x="977" y="144">B10-B13  shared 12 V supply</text>
    <text x="977" y="160">B2-B9    one return per solenoid</text>
    <text x="977" y="176">         (low-side switched)</text>
    <text x="977" y="198">EDS A, B (NC)  C, D, E (NO)</text>
    <text x="977" y="214">TCC (NC), line pressure (NO)</text>
    <text x="977" y="230">MV Pos = park release (on/off)</text>
    <text x="977" y="252">variable force coils ~5.5 Ω</text>
    <text x="977" y="268">park coils ~25 Ω</text>
    <text x="977" y="290">Order on B: spec 12 §1.3</text>
    <text x="977" y="310">E-Shift valve body needed for</text>
    <text x="977" y="326">park control (spec 14)</text>
  </g>

  <rect x="965" y="370" width="240" height="245" rx="6" class="box" fill="#ffffff"/>
  <text x="977" y="389" class="h">C row: sensors and valve 9</text>
  <g class="m">
    <text x="977" y="410">C2   output speed (OSS)</text>
    <text x="977" y="426">C3   input speed (ISS)</text>
    <text x="977" y="442">C4   ISS/OSS shared ground</text>
    <text x="977" y="458">C5   park position sender</text>
    <text x="977" y="474">C7   valve 9 return</text>
    <text x="977" y="489">     [I] park hold</text>
    <text x="977" y="505">C12  fluid temp signal</text>
    <text x="977" y="521">C13  fluid temp ground</text>
  </g>
  <text x="977" y="546" class="s">ISS/OSS: 2-wire Hall sensors;</text>
  <text x="977" y="561" class="s">OSS reads the parking gear teeth.</text>
  <text x="977" y="584" class="s">Speeds/contacts unverified:</text>
  <text x="977" y="599" class="s">no mechatronic on the bench.</text>

  <!-- ===== connections ===== -->
  <path d="M250,146 L300,146" class="ln2"/>
  <path d="M250,186 C270,186 280,250 300,250" class="ln"/>
  <path d="M450,150 L470,150" class="ln2"/>
  <path d="M450,255 L470,255" class="ln"/>
  <path d="M470,615 L450,615" class="ln2"/>
  <path d="M730,170 L750,170" class="ln"/>
  <path d="M730,405 L750,405" class="ln"/>
  <path d="M750,525 L730,525" class="ln"/>
  <path d="M900,225 L965,225" class="ln"/>
  <path d="M900,405 C930,405 940,474 965,474" class="ln"/>
  <path d="M965,440 C930,440 925,520 900,520" class="ln"/>
  <text x="905" y="218" class="s">B2-B9</text>

  <!-- ===== tools ===== -->
  <rect x="20" y="790" width="1200" height="90" rx="8" class="box" fill="#eef6f6"/>
  <text x="35" y="812" class="h">Bench tools (on pins 5/6, never both at once)</text>
  <g class="s">
    <text x="35" y="832">ACDP-2 (module 19): reads everything; writes code flash through the boot MAT plant session; installs the project loader once; recovery path.</text>
    <text x="35" y="850">Teensy 4.1 (SLCAN, 2 buses): measurement protocol, UDS, bench tests; updates the RAM application in data flash through the project loader (app-flash).</text>
    <text x="35" y="868">Teensy and ACDP-2 must not share the bus: the Teensy breaks the ACDP-2 power-up even when listen-only.</text>
  </g>
</svg>
